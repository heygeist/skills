name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  npm-installer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run

  social-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/social-image

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/social-image/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run smoke

  setup-social-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/setup-social-image

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/setup-social-image/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run smoke
